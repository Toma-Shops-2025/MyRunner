[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"
  # Public Supabase values are embedded in the client bundle by design
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_PUBLISHABLE_KEY,SUPABASE_URL,VITE_SUPABASE_URL,VITE_PAYMENTS_CLIENT_TOKEN"

# Do NOT add a catch-all SPA redirect — TanStack Start SSR handles routing via Netlify Functions.
