# Build a signed Play Store AAB. Trigger from the GitHub app on your phone:
# Actions → "Build Android AAB" → Run workflow.
name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      bump_version_code:
        description: Increase versionCode by 1 before building
        type: boolean
        default: true
      commit_version_bump:
        description: Push versionCode bump to this branch (keeps repo in sync with Play)
        type: boolean
        default: true

concurrency:
  group: build-android-aab
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/myrunner-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "::error::Missing repository secret: $name (see docs/ANDROID_AAB_CI.md)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle (Capacitor shell)
        run: bun run build

      - name: Generate Android icons and splash
        run: bun run assets:generate

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Bump versionCode
        if: inputs.bump_version_code
        id: version
        run: |
          set -euo pipefail
          GRADLE_FILE="android/app/build.gradle"
          current=$(grep -oE 'versionCode [0-9]+' "$GRADLE_FILE" | awk '{print $2}')
          next=$((current + 1))
          sed -i "s/versionCode ${current}/versionCode ${next}/" "$GRADLE_FILE"
          version_name=$(grep -oE 'versionName "[^"]+"' "$GRADLE_FILE" | head -1 | cut -d'"' -f2)
          echo "previous=$current" >> "$GITHUB_OUTPUT"
          echo "code=$next" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "Bumped versionCode $current → $next (versionName $version_name)"

      - name: Record versionCode (no bump)
        if: ${{ !inputs.bump_version_code }}
        id: version_no_bump
        run: |
          set -euo pipefail
          GRADLE_FILE="android/app/build.gradle"
          current=$(grep -oE 'versionCode [0-9]+' "$GRADLE_FILE" | awk '{print $2}')
          version_name=$(grep -oE 'versionName "[^"]+"' "$GRADLE_FILE" | head -1 | cut -d'"' -f2)
          echo "code=$current" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

      - name: Prepare artifact
        id: artifact
        run: |
          set -euo pipefail
          CODE="${{ steps.version.outputs.code || steps.version_no_bump.outputs.code }}"
          NAME="${{ steps.version.outputs.name || steps.version_no_bump.outputs.name }}"
          SRC="android/app/build/outputs/bundle/release/app-release.aab"
          OUT="myrunner-${NAME}-vc${CODE}.aab"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: myrunner-aab-vc${{ steps.artifact.outputs.code }}
          path: ${{ steps.artifact.outputs.file }}
          retention-days: 90
          if-no-files-found: error

      - name: Commit versionCode bump
        if: inputs.bump_version_code && inputs.commit_version_bump
        env:
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          if git diff --quiet android/app/build.gradle; then
            echo "No gradle change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle
          git commit -m "chore(android): bump versionCode to ${CODE} [skip ci]"
          git push

      - name: Job summary
        run: |
          {
            echo "### Android AAB ready"
            echo ""
            echo "- **versionName:** ${{ steps.artifact.outputs.name }}"
            echo "- **versionCode:** ${{ steps.artifact.outputs.code }}"
            echo "- Download the artifact **myrunner-aab-vc${{ steps.artifact.outputs.code }}** from this workflow run."
            echo "- Upload it in [Play Console](https://play.google.com/console) → Testing or Production."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"